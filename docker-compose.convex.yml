version: "3.8"

services:
  convex:
    image: convex/server:latest
    container_name: convex-server
    ports:
      - "8000:8000" # API port
      - "8001:8001" # Admin dashboard
    environment:
      - CONVEX_ADMIN_PASSWORD=your_secure_password_here # Replace with your secure password
      - CONVEX_HOST_DOMAIN=your_vm_domain_or_ip_here # e.g., convex.yourdomain.com or VM's IP address
    volumes:
      - ./convex-data:/data
    restart: unless-stopped

volumes:
  convex-data:
